server.port=8082
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:hsqldb:file:/data/appdb;shutdown=true}
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
jwt.secret=${JWT_SECRET:default-secret-change-in-production}
audit.service.url=${AUDIT_SERVICE_URL:http://audit-service:8084}
internal.api.key=${INTERNAL_API_KEY:default-internal-key}
