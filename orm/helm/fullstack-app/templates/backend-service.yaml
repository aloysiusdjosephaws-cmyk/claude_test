apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullstack-app.fullname" . }}-backend
  labels:
    {{- include "fullstack-app.labels" . | nindent 4 }}
    {{- include "fullstack-app.backend.selectorLabels" . | nindent 4 }}
  {{- if eq .Values.backend.service.type "LoadBalancer" }}
  annotations:
    # Tell OCI which public subnet to create the Load Balancer in.
    # This annotation is read by the OCI CCM (Cloud Controller Manager) on OKE.
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "100"
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fullstack-app.backend.selectorLabels" . | nindent 4 }}
