version: '3.9'

services:

  # ─── Audit Service (no dependencies — start first) ──────────────────────────
  audit-service:
    build:
      context: ./services/audit-service
    container_name: audit-service
    ports:
      - "8084:8084"
    volumes:
      - auditdb-data:/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:hsqldb:file:/data/auditdb;shutdown=true
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      SERVER_PORT: 8084
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── User Management Service ─────────────────────────────────────────────────
  user-management-service:
    build:
      context: ./services/user-management-service
    container_name: user-management-service
    ports:
      - "8081:8081"
    volumes:
      - userdb-data:/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:hsqldb:file:/data/userdb;shutdown=true
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      AUDIT_SERVICE_URL: http://audit-service:8084
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      audit-service:
        condition: service_healthy
    restart: unless-stopped

  # ─── Application Management Service ──────────────────────────────────────────
  application-management-service:
    build:
      context: ./services/application-management-service
    container_name: application-management-service
    ports:
      - "8082:8082"
    volumes:
      - appdb-data:/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:hsqldb:file:/data/appdb;shutdown=true
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      AUDIT_SERVICE_URL: http://audit-service:8084
      USER_SERVICE_URL: http://user-management-service:8081
      SERVER_PORT: 8082
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      user-management-service:
        condition: service_healthy
    restart: unless-stopped

  # ─── Document Management Service ─────────────────────────────────────────────
  document-management-service:
    build:
      context: ./services/document-management-service
    container_name: document-management-service
    ports:
      - "8083:8083"
    volumes:
      - docdb-data:/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:hsqldb:file:/data/docdb;shutdown=true
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      AUDIT_SERVICE_URL: http://audit-service:8084
      APP_SERVICE_URL: http://application-management-service:8082
      SERVER_PORT: 8083
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      application-management-service:
        condition: service_healthy
    restart: unless-stopped

  # ─── Frontend (Nginx + Angular) ───────────────────────────────────────────────
  frontend-client:
    build:
      context: ./frontend
    container_name: frontend-client
    ports:
      - "4200:80"
    depends_on:
      user-management-service:
        condition: service_healthy
      application-management-service:
        condition: service_healthy
      document-management-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  auditdb-data:
  userdb-data:
  appdb-data:
  docdb-data:
