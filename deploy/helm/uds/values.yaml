# ─── Document Management Service ─────────────────────────────────────────────
documentManagement:
  image:
    repository: document-management-service
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8083

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  hsqldb:
    storage:
      size: 5Gi          # larger: stores file BLOBs
      storageClassName: ""
      mountPath: /data

  env:
    SPRING_DATASOURCE_URL: "jdbc:hsqldb:file:/data/docdb;shutdown=true"
    SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "50MB"
    SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "50MB"
    JWT_SECRET: "change-me-in-production"
    INTERNAL_API_KEY: "internal-secret-key"
    AUDIT_SERVICE_URL: "http://audit-service:8084"
    APP_SERVICE_URL: "http://application-management-service:8082"

# ─── Frontend ────────────────────────────────────────────────────────────────
frontend:
  image:
    repository: frontend-client
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

  ingress:
    enabled: true
    className: ""            # set to "nginx" when using ingress-nginx controller
    host: localhost
    path: /
    pathType: Prefix
    annotations: {}
    tls: []

# ─── Global ──────────────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
