# ─── Audit Service ───────────────────────────────────────────────────────────
audit:
  image:
    repository: audit-service
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8084

  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

  hsqldb:
    storage:
      size: 1Gi
      storageClassName: ""
      mountPath: /data

  env:
    SPRING_DATASOURCE_URL: "jdbc:hsqldb:file:/data/auditdb;shutdown=true"
    JWT_SECRET: "change-me-in-production"
    INTERNAL_API_KEY: "internal-secret-key"

