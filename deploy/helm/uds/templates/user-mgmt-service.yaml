apiVersion: v1
kind: Service
metadata:
  name: user-management-service
  labels:
    {{- include "uds.labels" . | nindent 4 }}
    {{- include "uds.userMgmt.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.userManagement.service.type }}
  ports:
    - port: {{ .Values.userManagement.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "uds.userMgmt.selectorLabels" . | nindent 4 }}
