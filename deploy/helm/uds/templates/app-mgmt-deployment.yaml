apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uds.fullname" . }}-app-mgmt
  labels:
    {{- include "uds.labels" . | nindent 4 }}
    {{- include "uds.appMgmt.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.applicationManagement.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "uds.appMgmt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uds.appMgmt.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app-mgmt
          image: "{{ .Values.applicationManagement.image.repository }}:{{ .Values.applicationManagement.image.tag }}"
          imagePullPolicy: {{ .Values.applicationManagement.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.applicationManagement.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.applicationManagement.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.applicationManagement.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.applicationManagement.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.applicationManagement.resources | nindent 12 }}
          volumeMounts:
            - name: hsqldb-storage
              mountPath: {{ .Values.applicationManagement.hsqldb.storage.mountPath }}
      volumes:
        - name: hsqldb-storage
          persistentVolumeClaim:
            claimName: {{ include "uds.fullname" . }}-appdb
