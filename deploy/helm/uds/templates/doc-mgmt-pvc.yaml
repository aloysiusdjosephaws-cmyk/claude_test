apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "uds.fullname" . }}-docdb
  labels:
    {{- include "uds.labels" . | nindent 4 }}
    {{- include "uds.docMgmt.selectorLabels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.documentManagement.hsqldb.storage.storageClassName }}
  storageClassName: {{ .Values.documentManagement.hsqldb.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.documentManagement.hsqldb.storage.size }}
