# OCI / OKE overrides — used alongside values.yaml
# See RUNNING.md for the full OCI deployment walkthrough.
#
# Before deploying:
#   1. Replace YOUR_REGION, YOUR_NAMESPACE, and YOUR_TAG below.
#   2. Build images with NG_CONFIG=production and push to OCIR.
#   3. Create the OCIR pull secret and TLS secret (see RUNNING.md).
#
# Verify OKE storage class before deploying:
#   kubectl get storageclass   # should show oci-bv

imagePullSecrets:
  - name: ocir-secret

# ─── Audit Service ────────────────────────────────────────────────────────────
audit:
  image:
    repository: us-phoenix-1.ocir.io/axsagiglxgxl/audit-service
    tag: 1.0.0
    pullPolicy: Always
  hsqldb:
    storage:
      storageClassName: oci-bv

# ─── User Management Service ──────────────────────────────────────────────────
userManagement:
  image:
    repository: us-phoenix-1.ocir.io/axsagiglxgxl/user-management-service
    tag: 1.0.0
    pullPolicy: Always
  hsqldb:
    storage:
      storageClassName: oci-bv

# ─── Application Management Service ──────────────────────────────────────────
applicationManagement:
  image:
    repository: us-phoenix-1.ocir.io/axsagiglxgxl/application-management-service
    tag: 1.0.0
    pullPolicy: Always
  hsqldb:
    storage:
      storageClassName: oci-bv

# ─── Document Management Service ─────────────────────────────────────────────
documentManagement:
  image:
    repository: us-phoenix-1.ocir.io/axsagiglxgxl/document-management-service
    tag: 1.0.0
    pullPolicy: Always
  hsqldb:
    storage:
      storageClassName: oci-bv

# ─── Frontend ─────────────────────────────────────────────────────────────────
frontend:
  image:
    repository: us-phoenix-1.ocir.io/axsagiglxgxl/frontend-client
    tag: 1.0.2
    pullPolicy: Always
  ingress:
    enabled: true
    className: nginx
    host: ""              # leave empty to match any hostname
    path: /
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      - secretName: uds-tls   # kubectl create secret tls uds-tls --cert=tls.crt --key=tls.key
