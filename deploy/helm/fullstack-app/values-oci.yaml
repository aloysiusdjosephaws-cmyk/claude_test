# OCI / OKE overrides — used alongside values.yaml
# NOTE: Do NOT use this file for local kind clusters — kind uses storageClassName=standard.
# Verify OKE storage class with: kubectl get storageclass (should show oci-bv)
#
# Usage:
#   helm upgrade --install my-release ./deploy/helm/fullstack-app \
#     -f ./deploy/helm/fullstack-app/values-oci.yaml \
#     --set audit.env.JWT_SECRET=<secret> \
#     --set audit.env.INTERNAL_API_KEY=<key> \
#     --set userManagement.env.JWT_SECRET=<secret> \
#     --set userManagement.env.INTERNAL_API_KEY=<key> \
#     --set applicationManagement.env.JWT_SECRET=<secret> \
#     --set applicationManagement.env.INTERNAL_API_KEY=<key> \
#     --set documentManagement.env.JWT_SECRET=<secret> \
#     --set documentManagement.env.INTERNAL_API_KEY=<key>
#
# Before deploying:
#   1. Replace YOUR_REGION, YOUR_NAMESPACE, and YOUR_TAG below.
#   2. Create the OCIR pull secret:
#        kubectl create secret docker-registry ocir-secret \
#          --docker-server=YOUR_REGION.ocir.io \
#          --docker-username='YOUR_NAMESPACE/oracleidentitycloudservice/your@email.com' \
#          --docker-password='YOUR_AUTH_TOKEN'

imagePullSecrets:
  - name: ocir-secret

# ─── Audit Service ────────────────────────────────────────────────────────────
audit:
  image:
    repository: YOUR_REGION.ocir.io/YOUR_NAMESPACE/audit-service
    tag: 1.0.0
    pullPolicy: Always
  hsqldb:
    storage:
      storageClassName: oci-bv

# ─── User Management Service ──────────────────────────────────────────────────
userManagement:
  image:
    repository: YOUR_REGION.ocir.io/YOUR_NAMESPACE/user-management-service
    tag: 1.0.0
    pullPolicy: Always
  hsqldb:
    storage:
      storageClassName: oci-bv

# ─── Application Management Service ──────────────────────────────────────────
applicationManagement:
  image:
    repository: YOUR_REGION.ocir.io/YOUR_NAMESPACE/application-management-service
    tag: 1.0.0
    pullPolicy: Always
  hsqldb:
    storage:
      storageClassName: oci-bv

# ─── Document Management Service ─────────────────────────────────────────────
documentManagement:
  image:
    repository: YOUR_REGION.ocir.io/YOUR_NAMESPACE/document-management-service
    tag: 1.0.0
    pullPolicy: Always
  hsqldb:
    storage:
      storageClassName: oci-bv

# ─── Frontend ─────────────────────────────────────────────────────────────────
frontend:
  image:
    repository: YOUR_REGION.ocir.io/YOUR_NAMESPACE/frontend-client
    tag: 1.0.0
    pullPolicy: Always
  service:
    type: LoadBalancer    # OCI provisions a public Load Balancer automatically
  ingress:
    enabled: false        # use LoadBalancer service instead of Ingress on OKE
