apiVersion: v1
kind: Service
metadata:
  name: audit-service
  labels:
    {{- include "fullstack-app.labels" . | nindent 4 }}
    {{- include "fullstack-app.audit.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.audit.service.type }}
  ports:
    - port: {{ .Values.audit.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fullstack-app.audit.selectorLabels" . | nindent 4 }}
