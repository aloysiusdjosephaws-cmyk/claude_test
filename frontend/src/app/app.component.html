<div class="container">
  <h1>File Service</h1>

  <section class="upload-section">
    <h2>Upload File</h2>
    <label class="upload-btn">
      <input type="file" (change)="onFileSelected($event)" [disabled]="uploading" />
      {{ uploading ? 'Uploading...' : 'Choose & Upload File' }}
    </label>
    <p class="success" *ngIf="message">{{ message }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>
  </section>

  <section class="files-section">
    <h2>Stored Files</h2>
    <p *ngIf="files.length === 0" class="empty">No files uploaded yet.</p>
    <ul *ngIf="files.length > 0">
      <li *ngFor="let f of files">
        <span class="filename">{{ f.filename }}</span>
        <span class="content-type">{{ f.contentType }}</span>
        <a [href]="downloadUrl(f.id)" download class="download-btn">Download</a>
      </li>
    </ul>
  </section>
</div>
