server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Auth & User Management ──────────────────────────────────────────────
    location /api/auth {
        proxy_pass http://user-management-service:8081/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/users {
        proxy_pass http://user-management-service:8081/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Application Management ──────────────────────────────────────────────
    location /api/applications {
        proxy_pass http://application-management-service:8082/applications;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Document Management ─────────────────────────────────────────────────
    location /api/documents {
        proxy_pass http://document-management-service:8083/documents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
    }

    location /api/groups {
        proxy_pass http://document-management-service:8083/groups;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/help {
        proxy_pass http://document-management-service:8083/help;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
    }

    # ─── Audit Service (read-only from frontend — SuperUser/PO) ──────────────
    location /api/audit {
        proxy_pass http://audit-service:8084/audit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Caching ─────────────────────────────────────────────────────────────
    # index.html — never cache; fetching it fresh ensures new deployments are
    # picked up immediately (hashed JS/CSS filenames change on each build).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Hashed JS/CSS bundles — cache for 1 year.
    # Content-hash in filename guarantees a new URL on every change, so
    # "immutable" is safe: the browser never needs to revalidate.
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon — cache for 1 week (rarely changes)
    location = /favicon.ico {
        expires 1w;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Static assets (images, fonts, etc.) — 1 month
    location /assets/ {
        expires 1M;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ─── SPA fallback ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
